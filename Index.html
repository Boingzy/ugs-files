<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalcSolver</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    color: #eef7ff;
    background:
        radial-gradient(circle at 20% 10%, rgba(30, 130, 255, .18), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(0, 190, 255, .13), transparent 28%),
        linear-gradient(135deg, #020914 0%, #06172c 48%, #020811 100%);
    overflow-x: hidden;
}

/* Animated stars */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .65;
    background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(80,180,255,.55) 1px, transparent 1.5px);
    background-size: 73px 73px, 117px 117px;
    background-position: 8px 17px, 41px 64px;
    animation: stars 7s ease-in-out infinite alternate;
}

@keyframes stars {
    from {
        opacity: .35;
        transform: scale(1);
    }

    to {
        opacity: .75;
        transform: scale(1.015);
    }
}

.screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
    position: relative;
    z-index: 1;
}

.hidden {
    display: none !important;
}

/* =========================================
   CALCULATOR SCREEN
========================================= */

#calcScreen {
    flex-direction: column;
}

.brand {
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
    font-weight: 900;
    font-size: clamp(46px, 8vw, 82px);
    letter-spacing: -3px;
    color: #1597ff;
    text-shadow:
        0 0 10px rgba(21,151,255,.55),
        0 0 30px rgba(21,151,255,.28);
    margin-bottom: 22px;
    text-align: center;
}

.calculator {
    width: min(430px, 96vw);
    padding: 18px;
    border: 1px solid rgba(67,173,255,.42);
    border-radius: 26px;
    background: rgba(3,14,28,.9);
    box-shadow:
        0 0 30px rgba(0,125,255,.16),
        inset 0 0 25px rgba(0,125,255,.05);
    backdrop-filter: blur(8px);
}

.display {
    width: 100%;
    height: 92px;
    margin-bottom: 14px;
    border: 1px solid rgba(80,180,255,.3);
    border-radius: 16px;
    background: #010812;
    color: #dff3ff;
    padding: 14px 16px;
    font-size: clamp(24px, 6vw, 34px);
    text-align: right;
    outline: none;
}

.display:focus {
    border-color: #1597ff;
    box-shadow: 0 0 12px rgba(21,151,255,.25);
}

.keys {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 9px;
}

.key {
    min-height: 58px;
    border: 1px solid rgba(77,173,255,.25);
    border-radius: 14px;
    background: linear-gradient(145deg,#0a2945,#06192d);
    color: #eaf7ff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition:
        transform .12s,
        box-shadow .12s,
        border-color .12s,
        background .12s;
}

.key:hover {
    border-color: rgba(64,177,255,.65);
    box-shadow: 0 0 12px rgba(21,151,255,.18);
}

.key:active {
    transform: scale(.95);
}

.key.op {
    background: linear-gradient(145deg,#0c3a61,#08223a);
    color: #7fcaff;
}

.key.eq {
    background: linear-gradient(145deg,#087bd1,#07569b);
    color: white;
}

.key.danger {
    color: #ffb4b4;
}

.hint {
    margin: 13px 0 0;
    text-align: center;
    color: #7190a9;
    font-size: 12px;
}

/* =========================================
   GAMES SCREEN
========================================= */

#gamesScreen {
    display: block;
    padding: 18px 20px 40px;
}

.gamesTop {
    max-width: 1400px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    gap: 14px;
}

.gamesBrand {
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
    font-weight: 900;
    font-size: 34px;
    color: #1597ff;
    text-shadow: 0 0 10px rgba(21,151,255,.4);
    white-space: nowrap;
}

.searchWrap {
    flex: 1;
    display: flex;
    gap: 10px;
}

#gameSearch {
    width: 100%;
    height: 50px;
    border-radius: 15px;
    border: 1px solid rgba(73,174,255,.35);
    background: rgba(2,13,27,.88);
    color: white;
    padding: 0 17px;
    font-size: 17px;
    outline: none;
}

#gameSearch:focus {
    border-color: #1597ff;
    box-shadow: 0 0 15px rgba(21,151,255,.18);
}

.calcBtn {
    height: 50px;
    padding: 0 20px;
    border: 1px solid rgba(80,185,255,.45);
    border-radius: 15px;
    background: #082b49;
    color: #9fdcff;
    font-weight: 800;
    cursor: pointer;
}

.calcBtn:hover {
    background: #0b3c63;
    color: white;
}

/* Game layout */

.gamesLayout {
    max-width: 1400px;
    margin: auto;
    display: grid;
    grid-template-columns: 58px 1fr;
    gap: 18px;
}

/* Letter sidebar */

.alphabet {
    position: sticky;
    top: 15px;
    align-self: start;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 8px 5px;
    border: 1px solid rgba(73,174,255,.28);
    border-radius: 16px;
    background: rgba(2,13,27,.78);
    max-height: calc(100vh - 30px);
    overflow: auto;
}

.letter {
    width: 46px;
    height: 34px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: #8faec6;
    font-weight: 800;
    cursor: pointer;
    font-size: 13px;
}

.letter:hover,
.letter.active {
    background: #0b4775;
    color: white;
    box-shadow: 0 0 10px rgba(21,151,255,.18);
}

/* Games header */

.gamesHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 12px;
}

.gamesHeader h2 {
    margin: 0;
    font-size: 20px;
    color: #bfe5ff;
}

#gameCount {
    color: #66859e;
    font-size: 13px;
}

/* Game grid */

.gameGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(180px,1fr));
    gap: 11px;
}

.gameCard {
    min-height: 62px;
    text-align: left;
    padding: 12px 14px;
    border-radius: 13px;
    border: 1px solid rgba(73,174,255,.2);
    background: rgba(5,25,45,.84);
    color: #eaf7ff;
    font-weight: 700;
    cursor: pointer;
}

.gameCard:hover {
    border-color: #1597ff;
    box-shadow: 0 0 16px rgba(21,151,255,.15);
    background: #092b48;
}

.empty {
    padding: 35px;
    text-align: center;
    color: #7793a8;
}

/* =========================================
   GAME VIEWER
========================================= */

#gameViewer {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #010711;
    display: none;
    flex-direction: column;
}

#gameViewer.open {
    display: flex;
}

.viewerBar {
    height: 54px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: #061a2d;
    border-bottom: 1px solid #16466b;
}

.viewerBar button {
    height: 38px;
    padding: 0 13px;
    border: 1px solid #1c5a86;
    border-radius: 9px;
    background: #082944;
    color: #dff4ff;
    cursor: pointer;
}

.viewerTitle {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #9fdcff;
    font-weight: 700;
}

#gameFrame {
    flex: 1;
    width: 100%;
    border: 0;
    background: white;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:650px) {

    .gamesTop {
        flex-wrap: wrap;
    }

    .gamesBrand {
        width: 100%;
        text-align: center;
    }

    .searchWrap {
        order: 2;
        width: 100%;
    }

    .calcBtn {
        order: 3;
    }

    .gamesLayout {
        grid-template-columns: 46px 1fr;
        gap: 9px;
    }

    .alphabet {
        padding: 5px 2px;
    }

    .letter {
        width: 38px;
        height: 32px;
    }

    .gameGrid {
        grid-template-columns: repeat(auto-fill,minmax(140px,1fr));
    }
}
</style>
</head>

<body>

<!-- =========================================
     CALCULATOR
========================================= -->

<section id="calcScreen" class="screen">

    <div class="brand">
        CalcSolver
    </div>

    <div class="calculator">

        <input
            id="display"
            class="display"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            spellcheck="false"
            aria-label="Calculator display"
        >

        <div class="keys">

            <button class="key danger" data-action="clear">
                AC
            </button>

            <button class="key danger" data-action="delete">
                DEL
            </button>

            <button class="key" data-value="(">
                (
            </button>

            <button class="key" data-value=")">
                )
            </button>

            <button class="key op" data-value="/">
                ÷
            </button>


            <button class="key op" data-value="sin(">
                sin
            </button>

            <button class="key op" data-value="cos(">
                cos
            </button>

            <button class="key op" data-value="tan(">
                tan
            </button>

            <button class="key op" data-value="sqrt(">
                √
            </button>

            <button class="key op" data-value="*">
                ×
            </button>


            <button class="key" data-value="7">
                7
            </button>

            <button class="key" data-value="8">
                8
            </button>

            <button class="key" data-value="9">
                9
            </button>

            <button class="key op" data-value="^">
                xʸ
            </button>

            <button class="key op" data-value="-">
                −
            </button>


            <button class="key" data-value="4">
                4
            </button>

            <button class="key" data-value="5">
                5
            </button>

            <button class="key" data-value="6">
                6
            </button>

            <button class="key op" data-value="log(">
                log
            </button>

            <button class="key op" data-value="+">
                +
            </button>


            <button class="key" data-value="1">
                1
            </button>

            <button class="key" data-value="2">
                2
            </button>

            <button class="key" data-value="3">
                3
            </button>

            <button class="key op" data-value="π">
                π
            </button>

            <button class="key eq" data-action="equals">
                =
            </button>


            <button class="key" data-value="0">
                0
            </button>

            <button class="key" data-value=".">
                .
            </button>

            <button class="key op" data-value="ln(">
                ln
            </button>

            <button class="key op" data-value="abs(">
                abs
            </button>

            <button class="key" data-value="00">
                00
            </button>

        </div>

        <div class="hint">
            Calculator mode • Press 0 seven times quickly to unlock Games
        </div>

    </div>

</section>


<!-- =========================================
     GAMES
========================================= -->

<section id="gamesScreen" class="hidden">

    <div class="gamesTop">

        <div class="gamesBrand">
            CalcSolver
        </div>

        <div class="searchWrap">

            <input
                id="gameSearch"
                type="search"
                placeholder="Search games..."
                autocomplete="off"
            >

        </div>

        <button
            id="calcBtn"
            class="calcBtn"
            type="button"
        >
            CALC
        </button>

    </div>


    <div class="gamesLayout">

        <!-- 1-9 / A-Z SIDEBAR -->

        <nav
            id="alphabet"
            class="alphabet"
            aria-label="Game index"
        >
        </nav>


        <main>

            <div class="gamesHeader">

                <h2>
                    Games
                </h2>

                <span id="gameCount">
                    Loading...
                </span>

            </div>

            <div
                id="gameGrid"
                class="gameGrid"
            >
            </div>

        </main>

    </div>

</section>


<!-- =========================================
     GAME VIEWER
========================================= -->

<div id="gameViewer">

    <div class="viewerBar">

        <button
            id="viewerBack"
            type="button"
        >
            ← Back
        </button>

        <button
            id="viewerReload"
            type="button"
        >
            Reload
        </button>

        <button
            id="viewerNewTab"
            type="button"
        >
            New Tab
        </button>

        <button
            id="viewerFullscreen"
            type="button"
        >
            Fullscreen
        </button>

        <div
            id="viewerTitle"
            class="viewerTitle"
        >
        </div>

    </div>

    <iframe
        id="gameFrame"
        title="Game"
    >
    </iframe>

</div>


<script>

(() => {

    "use strict";


    /* =========================================
       ELEMENTS
    ========================================= */

    const calcScreen =
        document.getElementById("calcScreen");

    const gamesScreen =
        document.getElementById("gamesScreen");

    const display =
        document.getElementById("display");

    const gameSearch =
        document.getElementById("gameSearch");

    const gameGrid =
        document.getElementById("gameGrid");

    const gameCount =
        document.getElementById("gameCount");

    const alphabet =
        document.getElementById("alphabet");

    const calcBtn =
        document.getElementById("calcBtn");

    const viewer =
        document.getElementById("gameViewer");

    const gameFrame =
        document.getElementById("gameFrame");

    const viewerTitle =
        document.getElementById("viewerTitle");


    let allGames = [];

    let currentGames = [];

    let currentLetter = "ALL";

    let zeroTimes = [];


    /* =========================================
       SPECIAL GAME NAMES
    ========================================= */

    const nameOverrides = {

        "cl2048.html":
            "2048",

        "cl2048cupcakes.html":
            "2048 Cupcakes",

        "cl8ballpool.html":
            "8 Ball Pool",

        "clFIFA07.html":
            "FIFA 07",

        "clFIFA10.html":
            "FIFA 10",

        "clFIFA11.html":
            "FIFA 11",

        "clFIFA99.html":
            "FIFA 99",

        "clFNAF.html":
            "Five Nights at Freddy's",

        "clFNAF2.html":
            "Five Nights at Freddy's 2",

        "clFNAF3.html":
            "Five Nights at Freddy's 3",

        "clFNAF4.html":
            "Five Nights at Freddy's 4",

        "clBTD1.html":
            "Bloons Tower Defense",

        "clNBAjam.html":
            "NBA Jam",

        "clPokemonemeraldrouge.html":
            "Pokémon Emerald Rogue",

        "clPokemonrocketedition.html":
            "Pokémon Rocket Edition",

        "clSonic2ScoreRush.html":
            "Sonic 2 Score Rush",

        "clSonicHellfireSaga.html":
            "Sonic Hellfire Saga",

        "clUltimatecardrivingsimulator.html":
            "Ultimate Car Driving Simulator",

        "Eaglercraft-Alpha-1.2.6-Offline.html":
            "Eaglercraft Alpha 1.2.6",

        "Eaglercraft-Beta-1.3-Offline.html":
            "Eaglercraft Beta 1.3",

        "Eaglercraft-Indev-Offline.html":
            "Eaglercraft Indev",

        "Eaglercraft-Indev-Offline (1).html":
            "Eaglercraft Indev",

        "EaglercraftL_1.9_v0_7_0_Offline_Signed.html":
            "Eaglercraft 1.9",

        "EaglercraftX 1.8.8(u29).html":
            "EaglercraftX 1.8.8",

        "EaglercraftZ_1.11.2.html":
            "EaglercraftZ 1.11.2"

    };


    /* =========================================
       GAME NAME CLEANUP
    ========================================= */

    function cleanGameName(filename) {

        if (nameOverrides[filename]) {

            return nameOverrides[filename];

        }

        let name =
            filename.replace(/\.html$/i, "");

        if (/^cl/i.test(name)) {

            name = name.slice(2);

        }

        name =
            name.replace(/[_-]+/g, " ");

        name =
            name.replace(/([a-z])([A-Z])/g, "$1 $2");

        name =
            name.replace(/([A-Za-z])(\d)/g, "$1 $2");

        name =
            name.replace(/(\d)([A-Za-z])/g, "$1 $2");

        name =
            name.replace(/\s+/g, " ").trim();

        return (
            name.replace(/\b\w/g, c => c.toUpperCase())
            || filename
        );

    }


    /* =========================================
       SWITCH TO CALCULATOR
    ========================================= */

    function showCalc() {

        gamesScreen.classList.add("hidden");

        calcScreen.classList.remove("hidden");

        closeGame();

        display.focus();

    }


    /* =========================================
       SWITCH TO GAMES
    ========================================= */

    function showGames() {

        calcScreen.classList.add("hidden");

        gamesScreen.classList.remove("hidden");

        renderAlphabet();

        renderGames();

        gameSearch.focus();

    }


    /* =========================================
       CALCULATOR
    ========================================= */

    function append(value) {

        if (display.value === "Error") {

            display.value = "";

        }

        display.value += value;

    }


    function calculate() {

        let expr =
            display.value.trim();

        if (!expr) {

            return;

        }

        try {

            expr =
                expr
                    .replace(/π/g, "Math.PI")
                    .replace(/\^/g, "**")
                    .replace(/\bsqrt\(/g, "Math.sqrt(")
                    .replace(/\blog\(/g, "Math.log10(")
                    .replace(/\bln\(/g, "Math.log(")
                    .replace(/\babs\(/g, "Math.abs(")

                    /*
                     * Trig functions use degrees.
                     */

                    .replace(
                        /\bsin\(/g,
                        "(Math.sin(Math.PI/180*"
                    )

                    .replace(
                        /\bcos\(/g,
                        "(Math.cos(Math.PI/180*"
                    )

                    .replace(
                        /\btan\(/g,
                        "(Math.tan(Math.PI/180*"
                    );


            /*
             * Only allow calculator characters.
             */

            if (
                !/^[0-9+\-*/().,\sA-Za-z_]*$/.test(
                    expr.replace(/\*\*/g, "")
                )
            ) {

                throw new Error();

            }


            /*
             * Prevent dangerous JavaScript words.
             */

            if (
                /constructor|prototype|window|document|globalThis|Function|eval/i
                    .test(expr)
            ) {

                throw new Error();

            }


            const result =
                Function(
                    '"use strict"; return (' +
                    expr +
                    ')'
                )();


            if (!Number.isFinite(result)) {

                throw new Error();

            }


            display.value =
                String(
                    Number.isInteger(result)
                        ? result
                        : Number(result.toPrecision(12))
                );

        }

        catch {

            display.value = "Error";

        }

    }


    /* =========================================
       CALCULATOR BUTTONS
    ========================================= */

    document
        .querySelectorAll(".key")
        .forEach(btn => {

            btn.addEventListener(
                "click",
                () => {

                    const action =
                        btn.dataset.action;

                    const value =
                        btn.dataset.value;


                    /*
                     * Secret seven-zero code.
                     *
                     * Seven 0 presses within
                     * two seconds opens Games.
                     */

                    if (value === "0") {

                        const now =
                            Date.now();

                        zeroTimes =
                            zeroTimes.filter(
                                t =>
                                    now - t <= 2000
                            );

                        zeroTimes.push(now);


                        if (zeroTimes.length >= 7) {

                            zeroTimes = [];

                            showGames();

                            return;

                        }

                    }


                    if (action === "clear") {

                        display.value = "";

                    }

                    else if (action === "delete") {

                        display.value =
                            display.value.slice(0, -1);

                    }

                    else if (action === "equals") {

                        calculate();

                    }

                    else if (value) {

                        append(value);

                    }


                    display.focus();

                }
            );

        });


    /* =========================================
       KEYBOARD CALCULATOR SUPPORT
    ========================================= */

    display.addEventListener(
        "keydown",
        e => {

            if (e.key === "Enter") {

                e.preventDefault();

                calculate();

            }


            if (e.key === "Escape") {

                display.value = "";

            }


            if (e.key === "0") {

                const now =
                    Date.now();

                zeroTimes =
                    zeroTimes.filter(
                        t =>
                            now - t <= 2000
                    );

                zeroTimes.push(now);


                if (zeroTimes.length >= 7) {

                    e.preventDefault();

                    zeroTimes = [];

                    showGames();

                }

            }

        }
    );


    /* =========================================
       ALPHABET / NUMBER SIDEBAR
    ========================================= */

    function renderAlphabet() {

        alphabet.innerHTML = "";


        const letters = [

            "ALL",

            "1",
            "2",
            "3",
            "4",
            "5",
            "6",
            "7",
            "8",
            "9",

            ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"

        ];


        letters.forEach(letter => {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "letter" +
                (
                    currentLetter === letter
                        ? " active"
                        : ""
                );

            button.textContent =
                letter;


            button.title =
                letter === "ALL"
                    ? "Show all games"
                    : "Games starting with " + letter;


            button.addEventListener(
                "click",
                () => {

                    currentLetter =
                        letter;

                    renderAlphabet();

                    renderGames();

                }
            );


            alphabet.appendChild(button);

        });

    }


    /* =========================================
       RENDER GAMES
    ========================================= */

    function renderGames() {

        const q =
            gameSearch.value
                .trim()
                .toLowerCase();


        currentGames =
            allGames.filter(file => {

                const name =
                    cleanGameName(file);


                const matchesSearch =
                    !q ||
                    name
                        .toLowerCase()
                        .includes(q) ||
                    file
                        .toLowerCase()
                        .includes(q);


                const first =
                    name
                        .trim()
                        .charAt(0)
                        .toUpperCase();


                const matchesLetter =
                    currentLetter === "ALL"
                    ||
                    first === currentLetter;


                return (
                    matchesSearch &&
                    matchesLetter
                );

            });


        gameGrid.innerHTML = "";


        gameCount.textContent =
            currentGames.length +
            (
                currentGames.length === 1
                    ? " game"
                    : " games"
            );


        if (!currentGames.length) {

            gameGrid.innerHTML =
                '<div class="empty">No games found.</div>';

            return;

        }


        const fragment =
            document.createDocumentFragment();


        currentGames.forEach(file => {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "gameCard";

            button.textContent =
                cleanGameName(file);


            button.addEventListener(
                "click",
                () => {

                    openGame(
                        file,
                        cleanGameName(file)
                    );

                }
            );


            fragment.appendChild(button);

        });


        gameGrid.appendChild(fragment);

    }


    /* =========================================
       LOAD GAME LIST
    ========================================= */

    async function loadGames() {

        try {

            const response =
                await fetch(
                    "allGames.txt",
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Could not load game list"
                );

            }


            allGames =
                [
                    ...new Set(

                        (
                            await response.text()
                        )
                            .split(/\r?\n/)
                            .map(x => x.trim())
                            .filter(
                                x =>
                                    /\.html$/i.test(x)
                            )

                    )
                ];


            renderGames();

        }

        catch (err) {

            gameCount.textContent =
                "Game list unavailable";


            gameGrid.innerHTML =
                `
                <div class="empty">
                    Could not load allGames.txt.
                    Make sure it is beside index.html
                    on the server.
                </div>
                `;

        }

    }


    /* =========================================
       OPEN GAME
    ========================================= */

    function openGame(file, title) {

        viewer.classList.add("open");

        viewerTitle.textContent =
            title;

        gameFrame.src =
            encodeURI(file);

        document.body.style.overflow =
            "hidden";

    }


    /* =========================================
       CLOSE GAME
    ========================================= */

    function closeGame() {

        viewer.classList.remove("open");

        gameFrame.src =
            "about:blank";

        document.body.style.overflow =
            "";

    }


    /* =========================================
       GAME VIEWER BUTTONS
    ========================================= */

    document
        .getElementById("viewerBack")
        .addEventListener(
            "click",
            closeGame
        );


    document
        .getElementById("viewerReload")
        .addEventListener(
            "click",
            () => {

                try {

                    gameFrame
                        .contentWindow
                        .location
                        .reload();

                }

                catch {

                    gameFrame.src =
                        gameFrame.src;

                }

            }
        );


    document
        .getElementById("viewerNewTab")
        .addEventListener(
            "click",
            () => {

                if (gameFrame.src) {

                    window.open(
                        gameFrame.src,
                        "_blank",
                        "noopener"
                    );

                }

            }
        );


    document
        .getElementById("viewerFullscreen")
        .addEventListener(
            "click",
            async () => {

                try {

                    await gameFrame.requestFullscreen();

                }

                catch {}

            }
        );


    /* =========================================
       CALC BUTTON
    ========================================= */

    calcBtn.addEventListener(
        "click",
        showCalc
    );


    /* =========================================
       GAME SEARCH
    ========================================= */

    gameSearch.addEventListener(
        "input",
        renderGames
    );


    /* =========================================
       ESCAPE CLOSES GAME
    ========================================= */

    document.addEventListener(
        "keydown",
        e => {

            if (
                e.key === "Escape" &&
                viewer.classList.contains("open")
            ) {

                closeGame();

            }

        }
    );


    /* =========================================
       STARTUP
    ========================================= */

    renderAlphabet();

    loadGames();

    display.focus();

})();

</script>

</body>
</html>
