<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CalcSolver</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        overflow-x: hidden;

        background:
            radial-gradient(circle at 20% 20%, rgba(0, 140, 255, 0.25), transparent 30%),
            radial-gradient(circle at 80% 80%, rgba(0, 80, 255, 0.20), transparent 35%),
            linear-gradient(135deg, #020817, #061a35 45%, #03152c);
    }

    /* =========================================
       ANIMATED BACKGROUND
    ========================================= */

    body::before {
        content: "";
        position: fixed;
        inset: -50%;
        z-index: -2;

        background:
            radial-gradient(circle, rgba(0, 153, 255, 0.13) 1px, transparent 2px);

        background-size: 70px 70px;

        animation: starsMove 30s linear infinite;
        pointer-events: none;
    }

    body::after {
        content: "";
        position: fixed;
        width: 500px;
        height: 500px;
        left: 50%;
        top: 35%;

        transform: translate(-50%, -50%);

        background: radial-gradient(
            circle,
            rgba(0, 132, 255, 0.13),
            transparent 70%
        );

        filter: blur(20px);
        animation: glowPulse 6s ease-in-out infinite;

        z-index: -1;
        pointer-events: none;
    }

    @keyframes starsMove {
        from {
            transform: translate(0, 0);
        }

        to {
            transform: translate(70px, 70px);
        }
    }

    @keyframes glowPulse {
        0%, 100% {
            opacity: 0.5;
            transform: translate(-50%, -50%) scale(0.9);
        }

        50% {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.15);
        }
    }

    /* =========================================
       TOP BAR
    ========================================= */

    .topbar {
        position: sticky;
        top: 0;
        z-index: 1000;

        height: 68px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 24px;

        background: rgba(2, 10, 25, 0.78);
        border-bottom: 1px solid rgba(72, 174, 255, 0.18);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        box-shadow:
            0 5px 30px rgba(0, 0, 0, 0.25);
    }

    .brand-small {
        font-size: 21px;
        font-weight: 900;

        color: #55baff;

        text-shadow:
            0 0 8px rgba(50, 180, 255, 0.7),
            0 0 25px rgba(0, 110, 255, 0.35);
    }

    .top-buttons {
        display: flex;
        gap: 10px;
    }

    .top-btn {
        border: 1px solid rgba(82, 188, 255, 0.25);

        background: rgba(20, 100, 170, 0.22);

        color: white;

        padding: 9px 15px;

        border-radius: 10px;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease;
    }

    .top-btn:hover {
        transform: translateY(-2px);

        background: rgba(30, 140, 220, 0.35);

        box-shadow:
            0 0 15px rgba(0, 153, 255, 0.25);
    }

    /* =========================================
       MAIN
    ========================================= */

    .container {
        width: min(1200px, 94%);
        margin: auto;
        padding: 45px 0 80px;
    }

    /* =========================================
       CALCSOLVER TITLE
    ========================================= */

    .title-area {
        text-align: center;
        margin-bottom: 35px;

        animation: titleAppear 0.8s ease;
    }

    @keyframes titleAppear {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .main-title {
        margin: 0;

        font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;

        font-size: clamp(48px, 9vw, 92px);

        font-weight: 900;

        letter-spacing: -4px;

        color: #67c7ff;

        text-shadow:
            0 0 5px rgba(95, 200, 255, 0.8),
            0 0 18px rgba(0, 145, 255, 0.65),
            0 0 45px rgba(0, 80, 255, 0.35);

        animation: titleGlow 4s ease-in-out infinite;
    }

    @keyframes titleGlow {
        0%, 100% {
            text-shadow:
                0 0 5px rgba(95, 200, 255, 0.8),
                0 0 18px rgba(0, 145, 255, 0.65),
                0 0 45px rgba(0, 80, 255, 0.35);
        }

        50% {
            text-shadow:
                0 0 8px rgba(120, 220, 255, 1),
                0 0 30px rgba(0, 155, 255, 0.85),
                0 0 65px rgba(0, 80, 255, 0.5);
        }
    }

    .subtitle {
        margin-top: 8px;
        color: rgba(220, 242, 255, 0.65);
        font-size: 15px;
        letter-spacing: 1px;
    }

    /* =========================================
       CALCULATOR
    ========================================= */

    .calculator-card {
        width: min(440px, 100%);
        margin: 0 auto 55px;

        padding: 18px;

        border-radius: 24px;

        background:
            linear-gradient(
                145deg,
                rgba(17, 45, 78, 0.9),
                rgba(4, 17, 37, 0.92)
            );

        border: 1px solid rgba(83, 193, 255, 0.25);

        box-shadow:
            0 20px 70px rgba(0, 0, 0, 0.35),
            0 0 30px rgba(0, 125, 255, 0.08);

        backdrop-filter: blur(18px);

        animation: cardFloat 6s ease-in-out infinite;
    }

    @keyframes cardFloat {
        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-4px);
        }
    }

    .calculator-label {
        text-align: center;

        font-size: 14px;
        font-weight: bold;

        color: #69c9ff;

        margin-bottom: 12px;

        letter-spacing: 1px;
    }

    .calculator-display {
        width: 100%;

        height: 72px;

        border: 1px solid rgba(90, 195, 255, 0.3);

        border-radius: 12px;

        background: #020a15;

        color: #8bd7ff;

        font-size: 29px;

        padding: 10px 14px;

        text-align: right;

        outline: none;

        box-shadow:
            inset 0 0 20px rgba(0, 100, 200, 0.12);

        margin-bottom: 12px;
    }

    .calculator-grid {
        display: grid;

        grid-template-columns: repeat(5, 1fr);

        gap: 8px;
    }

    .calc-btn {
        height: 54px;

        border: 1px solid rgba(86, 184, 255, 0.16);

        border-radius: 10px;

        background:
            linear-gradient(
                145deg,
                rgba(27, 69, 105, 0.9),
                rgba(10, 35, 60, 0.95)
            );

        color: white;

        font-size: 17px;
        font-weight: bold;

        cursor: pointer;

        transition:
            transform 0.12s ease,
            background 0.15s ease,
            box-shadow 0.15s ease;
    }

    .calc-btn:hover {
        background:
            linear-gradient(
                145deg,
                rgba(37, 112, 170, 0.95),
                rgba(13, 55, 95, 0.95)
            );

        box-shadow:
            0 0 14px rgba(0, 150, 255, 0.22);
    }

    .calc-btn:active {
        transform: scale(0.94);
    }

    .calc-blue {
        background: rgba(0, 119, 204, 0.55);
    }

    .calc-equals {
        background: linear-gradient(
            145deg,
            #008fe8,
            #0062b3
        );
    }

    .calc-wide {
        grid-column: span 2;
    }

    /* =========================================
       GAMES SECTION
    ========================================= */

    .games-heading {
        text-align: center;
        margin-bottom: 20px;
    }

    .games-heading h2 {
        margin: 0;

        font-size: 34px;

        color: white;

        text-shadow:
            0 0 15px rgba(0, 150, 255, 0.35);
    }

    .games-heading p {
        margin: 8px 0 25px;

        color: rgba(220, 240, 255, 0.6);
    }

    /* =========================================
       SEARCH
    ========================================= */

    .search-wrapper {
        max-width: 650px;
        margin: 0 auto 30px;

        position: relative;
    }

    #gameSearch {
        width: 100%;

        padding: 16px 20px;

        border-radius: 15px;

        border: 1px solid rgba(82, 185, 255, 0.3);

        outline: none;

        background: rgba(4, 20, 40, 0.82);

        color: white;

        font-size: 16px;

        box-shadow:
            0 10px 35px rgba(0, 0, 0, 0.22);

        backdrop-filter: blur(10px);

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    #gameSearch::placeholder {
        color: rgba(220, 240, 255, 0.45);
    }

    #gameSearch:focus {
        border-color: rgba(78, 190, 255, 0.65);

        box-shadow:
            0 0 25px rgba(0, 145, 255, 0.18);
    }

    /* =========================================
       GAME GRID
    ========================================= */

    #gameGrid {
        display: grid;

        grid-template-columns:
            repeat(auto-fill, minmax(220px, 1fr));

        gap: 13px;
    }

    .game-card {
        min-height: 64px;

        padding: 16px 18px;

        display: flex;
        align-items: center;

        border-radius: 14px;

        border: 1px solid rgba(82, 182, 255, 0.15);

        background:
            linear-gradient(
                145deg,
                rgba(16, 48, 78, 0.82),
                rgba(5, 22, 43, 0.9)
            );

        color: white;

        cursor: pointer;

        text-align: left;

        font-size: 15px;
        font-weight: 600;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.18);

        transition:
            transform 0.2s ease,
            border-color 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease;

        animation: gameAppear 0.35s ease both;
    }

    @keyframes gameAppear {
        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .game-card:hover {
        transform: translateY(-4px);

        border-color: rgba(72, 191, 255, 0.55);

        background:
            linear-gradient(
                145deg,
                rgba(21, 81, 130, 0.9),
                rgba(7, 35, 68, 0.95)
            );

        box-shadow:
            0 12px 30px rgba(0, 0, 0, 0.28),
            0 0 20px rgba(0, 145, 255, 0.13);
    }

    .game-number {
        min-width: 28px;
        height: 28px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin-right: 12px;

        border-radius: 8px;

        background: rgba(0, 145, 255, 0.15);

        color: #6bcaff;

        font-size: 12px;
    }

    /* =========================================
       LOADING / EMPTY
    ========================================= */

    .status {
        text-align: center;

        color: rgba(220, 240, 255, 0.65);

        padding: 30px;
    }

    .loader {
        width: 34px;
        height: 34px;

        margin: 0 auto 15px;

        border-radius: 50%;

        border: 3px solid rgba(100, 200, 255, 0.15);

        border-top-color: #50bdff;

        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* =========================================
       GAME WINDOW
    ========================================= */

    #gameViewer {
        position: fixed;
        inset: 0;

        z-index: 5000;

        display: none;
        flex-direction: column;

        background: #020712;
    }

    #gameViewer.active {
        display: flex;
    }

    .game-toolbar {
        height: 58px;

        flex-shrink: 0;

        display: flex;
        align-items: center;

        gap: 8px;

        padding: 8px 12px;

        background: rgba(2, 12, 28, 0.96);

        border-bottom: 1px solid rgba(70, 180, 255, 0.2);
    }

    .game-toolbar-title {
        flex: 1;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;

        color: #83d4ff;

        font-weight: bold;

        padding-left: 8px;
    }

    .viewer-btn {
        border: 1px solid rgba(85, 190, 255, 0.2);

        background: rgba(18, 66, 105, 0.6);

        color: white;

        border-radius: 8px;

        padding: 8px 12px;

        cursor: pointer;

        transition: 0.2s;
    }

    .viewer-btn:hover {
        background: rgba(30, 120, 190, 0.7);
    }

    #gameFrame {
        flex: 1;

        width: 100%;

        border: none;

        background: black;
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

        .topbar {
            padding: 0 12px;
        }

        .top-buttons {
            gap: 5px;
        }

        .top-btn {
            padding: 8px 9px;
            font-size: 12px;
        }

        .container {
            width: 94%;
            padding-top: 30px;
        }

        .main-title {
            font-size: 58px;
            letter-spacing: -3px;
        }

        #gameGrid {
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
        }

        .game-card {
            min-height: 60px;
            padding: 12px;
            font-size: 13px;
        }

        .calculator-grid {
            gap: 5px;
        }

        .calc-btn {
            height: 48px;
            font-size: 14px;
        }
    }
</style>
</head>

<body>

<!-- =========================================
     TOP BAR
========================================= -->

<header class="topbar">

    <div class="brand-small">
        CalcSolver
    </div>

    <div class="top-buttons">

        <button class="top-btn" onclick="scrollToCalculator()">
            Calculator
        </button>

        <button class="top-btn" onclick="scrollToGames()">
            Games
        </button>

    </div>

</header>


<!-- =========================================
     MAIN CONTENT
========================================= -->

<main class="container">

    <!-- TITLE -->

    <section class="title-area">

        <h1 class="main-title">
            CalcSolver
        </h1>

        <div class="subtitle">
            Calculator • Games • More
        </div>

    </section>


    <!-- =====================================
         CALCULATOR
    ====================================== -->

    <section id="calculatorSection">

        <div class="calculator-card">

            <div class="calculator-label">
                SCIENTIFIC CALCULATOR
            </div>

            <input
                id="calculatorDisplay"
                class="calculator-display"
                type="text"
                value="0"
                readonly
            >

            <div class="calculator-grid">

                <button class="calc-btn calc-blue"
                    onclick="calculatorClear()">
                    AC
                </button>

                <button class="calc-btn"
                    onclick="calculatorBackspace()">
                    DEL
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('(')">
                    (
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput(')')">
                    )
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('/')">
                    ÷
                </button>


                <button class="calc-btn"
                    onclick="calculatorFunction('sin')">
                    sin
                </button>

                <button class="calc-btn"
                    onclick="calculatorFunction('cos')">
                    cos
                </button>

                <button class="calc-btn"
                    onclick="calculatorFunction('tan')">
                    tan
                </button>

                <button class="calc-btn"
                    onclick="calculatorFunction('sqrt')">
                    √
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('*')">
                    ×
                </button>


                <button class="calc-btn"
                    onclick="calculatorInput('7')">
                    7
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('8')">
                    8
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('9')">
                    9
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('^')">
                    ^
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('-')">
                    −
                </button>


                <button class="calc-btn"
                    onclick="calculatorInput('4')">
                    4
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('5')">
                    5
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('6')">
                    6
                </button>

                <button class="calc-btn"
                    onclick="calculatorFunction('log')">
                    log
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('+')">
                    +
                </button>


                <button class="calc-btn"
                    onclick="calculatorInput('1')">
                    1
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('2')">
                    2
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('3')">
                    3
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('Math.PI')">
                    π
                </button>

                <button class="calc-btn calc-equals"
                    onclick="calculatorEquals()">
                    =
                </button>


                <button class="calc-btn calc-wide"
                    onclick="calculatorInput('0')">
                    0
                </button>

                <button class="calc-btn"
                    onclick="calculatorInput('.')">
                    .
                </button>

                <button class="calc-btn"
                    onclick="calculatorFunction('ln')">
                    ln
                </button>

                <button class="calc-btn"
                    onclick="calculatorFunction('abs')">
                    abs
                </button>

            </div>

        </div>

    </section>


    <!-- =====================================
         GAMES
    ====================================== -->

    <section id="gamesSection">

        <div class="games-heading">

            <h2>
                Games
            </h2>

            <p>
                Choose a game to launch it
            </p>

        </div>


        <div class="search-wrapper">

            <input
                id="gameSearch"
                type="text"
                placeholder="Search games..."
                autocomplete="off"
            >

        </div>


        <div id="gameStatus" class="status">

            <div class="loader"></div>

            Loading games...

        </div>


        <div id="gameGrid"></div>

    </section>

</main>


<!-- =========================================
     GAME VIEWER
========================================= -->

<div id="gameViewer">

    <div class="game-toolbar">

        <button
            class="viewer-btn"
            onclick="closeGame()">
            ← Back
        </button>

        <button
            class="viewer-btn"
            onclick="reloadGame()">
            ↻
        </button>

        <div
            id="gameViewerTitle"
            class="game-toolbar-title">
            Game
        </div>

        <button
            class="viewer-btn"
            onclick="openGameNewTab()">
            New Tab
        </button>

        <button
            class="viewer-btn"
            onclick="fullscreenGame()">
            ⛶
        </button>

    </div>

    <iframe
        id="gameFrame"
        allowfullscreen>
    </iframe>

</div>


<script>

/* =========================================================
   CALCULATOR
========================================================= */

const calculatorDisplay =
    document.getElementById("calculatorDisplay");

let calculatorExpression = "";


function updateCalculator() {

    if (calculatorExpression === "") {
        calculatorDisplay.value = "0";
    } else {
        calculatorDisplay.value =
            calculatorExpression;
    }

}


function calculatorInput(value) {

    if (
        calculatorExpression === "Error" ||
        calculatorExpression === "Undefined"
    ) {
        calculatorExpression = "";
    }

    calculatorExpression += value;

    updateCalculator();
}


function calculatorClear() {

    calculatorExpression = "";

    updateCalculator();
}


function calculatorBackspace() {

    calculatorExpression =
        calculatorExpression.slice(0, -1);

    updateCalculator();
}


function calculatorFunction(functionName) {

    if (
        calculatorExpression === "Error" ||
        calculatorExpression === "Undefined"
    ) {
        calculatorExpression = "";
    }

    if (functionName === "sin") {
        calculatorExpression =
            "sin(" + calculatorExpression + ")";
    }

    else if (functionName === "cos") {
        calculatorExpression =
            "cos(" + calculatorExpression + ")";
    }

    else if (functionName === "tan") {
        calculatorExpression =
            "tan(" + calculatorExpression + ")";
    }

    else if (functionName === "sqrt") {
        calculatorExpression =
            "sqrt(" + calculatorExpression + ")";
    }

    else if (functionName === "log") {
        calculatorExpression =
            "log(" + calculatorExpression + ")";
    }

    else if (functionName === "ln") {
        calculatorExpression =
            "ln(" + calculatorExpression + ")";
    }

    else if (functionName === "abs") {
        calculatorExpression =
            "abs(" + calculatorExpression + ")";
    }

    updateCalculator();
}


function calculatorEquals() {

    try {

        let expression =
            calculatorExpression;

        expression =
            expression.replace(
                /×/g,
                "*"
            );

        expression =
            expression.replace(
                /÷/g,
                "/"
            );

        expression =
            expression.replace(
                /\^/g,
                "**"
            );

        expression =
            expression.replace(
                /sin\(/g,
                "Math.sin((Math.PI/180)*("
            );

        expression =
            expression.replace(
                /cos\(/g,
                "Math.cos((Math.PI/180)*("
            );

        expression =
            expression.replace(
                /tan\(/g,
                "Math.tan((Math.PI/180)*("
            );

        expression =
            expression.replace(
                /sqrt\(/g,
                "Math.sqrt("
            );

        expression =
            expression.replace(
                /log\(/g,
                "Math.log10("
            );

        expression =
            expression.replace(
                /ln\(/g,
                "Math.log("
            );

        expression =
            expression.replace(
                /abs\(/g,
                "Math.abs("
            );

        /*
            Basic safety check.

            Only allow characters/functions that
            belong to our calculator.
        */

        if (
            !/^[0-9+\-*/().,\s*MathPIa-zA-Z]+$/.test(
                expression
            )
        ) {

            throw new Error("Invalid");

        }


        const result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();


        if (
            typeof result !== "number" ||
            !Number.isFinite(result)
        ) {

            calculatorExpression =
                "Undefined";

        } else {

            calculatorExpression =
                String(
                    Math.round(
                        result * 1000000000
                    ) / 1000000000
                );

        }

    } catch (error) {

        calculatorExpression = "Error";

    }

    updateCalculator();
}


/* Keyboard calculator controls */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key >= "0" &&
            event.key <= "9"
        ) {

            calculatorInput(event.key);

        }

        else if (
            "+-*/().".includes(event.key)
        ) {

            calculatorInput(event.key);

        }

        else if (
            event.key === "Enter" ||
            event.key === "="
        ) {

            calculatorEquals();

        }

        else if (
            event.key === "Backspace"
        ) {

            calculatorBackspace();

        }

        else if (
            event.key === "Escape"
        ) {

            calculatorClear();

        }

    }
);


/* =========================================================
   GAME DATABASE
========================================================= */

let allGames = [];

let filteredGames = [];

let currentGameFile = "";


/*
    Names that are difficult to automatically determine
    from filenames can be corrected here.

    The actual filenames NEVER change.
*/

const nameOverrides = {

    "cl2048.html":
        "2048",

    "cl2048cupcakes.html":
        "2048 Cupcakes",

    "cl8ballpool.html":
        "8 Ball Pool",

/* =========================================================
   TURN FILE NAME INTO DISPLAY NAME
========================================================= */

function cleanGameName(filename) {

    if (nameOverrides[filename]) {

        return nameOverrides[filename];

    }


    let name =
        filename
            .replace(/\.html$/i, "")
            .replace(/^cl/i, "");


    /*
        Replace separators with spaces.
    */

    name =
        name.replace(/[_-]+/g, " ");


    /*
        Add spaces between camelCase words.
    */

    name =
        name.replace(
            /([a-z])([A-Z])/g,
            "$1 $2"
        );


    /*
        Separate numbers from letters.
    */

    name =
        name.replace(
            /([A-Za-z])([0-9])/g,
            "$1 $2"
        );

    name =
        name.replace(
            /([0-9])([A-Za-z])/g,
            "$1 $2"
        );


    /*
        Clean duplicate spaces.
    */

    name =
        name.replace(/\s+/g, " ")
            .trim();


    /*
        Capitalize words.
    */

    name =
        name
            .split(" ")
            .map(word => {

                if (
                    word.length <= 3 &&
                    /^[A-Z0-9]+$/.test(word)
                ) {

                    return word;

                }

                return word.charAt(0).toUpperCase()
                    + word.slice(1);

            })
            .join(" ");


    return name || filename;

}


/* =========================================================
   LOAD ALL GAMES
========================================================= */

async function loadGames() {

    const status =
        document.getElementById("gameStatus");

    try {

        /*
            allGames.txt is supplied in the ZIP.
            It should be in the same folder as this
            index.html.
        */

        const response =
            await fetch("allGames.txt");


        if (!response.ok) {

            throw new Error(
                "Could not load allGames.txt"
            );

        }


        const text =
            await response.text();


        allGames =
            text
                .split(/\r?\n/)
                .map(line => line.trim())
                .filter(line =>
                    line &&
                    line.toLowerCase().endsWith(".html")
                );


        /*
            Remove duplicates.
        */

        allGames =
            [...new Set(allGames)];


        filteredGames =
            [...allGames];


        renderGames();


    } catch (error) {

        console.error(error);


        status.innerHTML = `
            <strong>Couldn't load the game list.</strong>
            <br><br>
            Make sure this index.html is inside the
            same folder as <b>allGames.txt</b>.
        `;

    }

}


/* =========================================================
   DISPLAY GAMES
========================================================= */

function renderGames() {

    const grid =
        document.getElementById("gameGrid");

    const status =
        document.getElementById("gameStatus");


    grid.innerHTML = "";


    if (filteredGames.length === 0) {

        status.style.display = "block";

        status.innerHTML =
            "No games found.";

        return;

    }


    status.style.display = "none";


    const fragment =
        document.createDocumentFragment();


    filteredGames.forEach(
        (filename, index) => {

            const button =
                document.createElement("button");


            button.className =
                "game-card";


            const number =
                document.createElement("span");

            number.className =
                "game-number";

            number.textContent =
                index + 1;


            const title =
                document.createElement("span");

            title.textContent =
                cleanGameName(filename);


            button.appendChild(number);

            button.appendChild(title);


            button.onclick =
                () => openGame(
                    filename,
                    cleanGameName(filename)
                );


            fragment.appendChild(button);

        }
    );


    grid.appendChild(fragment);

}


/* =========================================================
   GAME SEARCH
========================================================= */

document
    .getElementById("gameSearch")
    .addEventListener(
        "input",
        function() {

            const query =
                this.value
                    .toLowerCase()
                    .trim();


            if (!query) {

                filteredGames =
                    [...allGames];

            } else {

                filteredGames =
                    allGames.filter(
                        filename => {

                            const name =
                                cleanGameName(
                                    filename
                                );

                            return (
                                name
                                    .toLowerCase()
                                    .includes(query)
                                ||
                                filename
                                    .toLowerCase()
                                    .includes(query)
                            );

                        }
                    );

            }


            renderGames();

        }
    );


/* =========================================================
   OPEN GAME
========================================================= */

function openGame(
    filename,
    title
) {

    currentGameFile =
        filename;


    const viewer =
        document.getElementById(
            "gameViewer"
        );


    const frame =
        document.getElementById(
            "gameFrame"
        );


    const titleElement =
        document.getElementById(
            "gameViewerTitle"
        );


    titleElement.textContent =
        title;


    /*
        Encode the filename so spaces,
        parentheses, etc. work correctly.
    */

    frame.src =
        encodeURI(filename);


    viewer.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   CLOSE GAME
========================================================= */

function closeGame() {

    const viewer =
        document.getElementById(
            "gameViewer"
        );


    const frame =
        document.getElementById(
            "gameFrame"
        );


    viewer.classList.remove(
        "active"
    );


    /*
        Clearing the iframe prevents
        the game from continuing to
        run after leaving it.
    */

    frame.src = "about:blank";


    document.body.style.overflow =
        "";

}


/* =========================================================
   RELOAD GAME
========================================================= */

function reloadGame() {

    const frame =
        document.getElementById(
            "gameFrame"
        );


    if (currentGameFile) {

        frame.src =
            encodeURI(
                currentGameFile
            );

    }

}


/* =========================================================
   OPEN GAME IN NEW TAB
========================================================= */

function openGameNewTab() {

    if (!currentGameFile) {
        return;
    }


    window.open(
        encodeURI(
            currentGameFile
        ),
        "_blank"
    );

}


/* =========================================================
   FULLSCREEN
========================================================= */

function fullscreenGame() {

    const frame =
        document.getElementById(
            "gameFrame"
        );


    if (
        frame.requestFullscreen
    ) {

        frame.requestFullscreen();

    }

}


/* =========================================================
   PAGE NAVIGATION
========================================================= */

function scrollToCalculator() {

    document
        .getElementById(
            "calculatorSection"
        )
        .scrollIntoView({
            behavior: "smooth"
        });

}


function scrollToGames() {

    document
        .getElementById(
            "gamesSection"
        )
        .scrollIntoView({
            behavior: "smooth"
        });

}


/* =========================================================
   ESCAPE KEY CLOSES GAME
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            const viewer =
                document.getElementById(
                    "gameViewer"
                );


            if (
                viewer.classList.contains(
                    "active"
                )
            ) {

                closeGame();

            }

        }

    }
);


/* =========================================================
   START
========================================================= */

loadGames();
